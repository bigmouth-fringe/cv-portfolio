name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-dejavu-core
      - run: pip install python-docx==1.2.0
      - run: node scripts/export-content.mjs && python scripts/generate-cv.py
      - name: Render PDF downloads
        run: |
          for directory in public/cv/*; do
            libreoffice -env:UserInstallation=file:///tmp/cv-render --headless --convert-to pdf --outdir "$directory" "$directory"/*.docx
            test -s "$directory/en.pdf" && test -s "$directory/ru.pdf"
          done
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
